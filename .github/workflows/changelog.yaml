---
name: Update changes and decisions

# Rebuilds docs/CHANGELOG_DECISIONS.md from the git history and the code, and
# commits it. Runs only on demand: Actions -> "Update changes and decisions"
# -> Run workflow. Run it at least once before the submission. Pull afterwards.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Rebuild and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            uv run --project openfisca-CH-SG --frozen python tools/build_changelog.py
            if git diff --quiet -- docs/CHANGELOG_DECISIONS.md; then
              echo "Already up to date."
              exit 0
            fi
            git add docs/CHANGELOG_DECISIONS.md
            git commit -m "Update changes and decisions [changelog-bot] [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another push, retrying ($attempt)..."
            sleep 5
          done
          exit 1
