# Grenzfälle (G1–G51), Fälle ohne Anspruch (X1–X10), Auslegungsfälle (Q1–Q4)
# und bekannte Einschränkung (E1) aus challenge/szenarien.md, Teile 2 bis 5.
# Nummern wie im Katalog. Zusatzfälle stammen nicht aus dem Katalog.
#
# Die Anker (&p1_..., &p7_...) halten die Angaben der Personas fest; mit
# «<<: *p1_...» wird nur geändert, was im Szenario anders ist.

- name: Basis P1 unverändert (hält die Angaben für die folgenden Fälle fest)
  period: 2028-09
  absolute_error_margin: 0.01
  input:
    household: &p1_haushalt
      erziehungsberechtigte: [mutter, vater]
      kinder: [lina]
      gemeinsamer_haushalt: true
    persons:
      mutter: &p1_mutter
        kibg_gesuchstellend: true
        wohnsitz_kanton_sg: true
        beschaeftigungsgrad: 1.0
        me_steuerveranlagung: {2028: 60000}
      vater: &p1_vater
        wohnsitz_kanton_sg: true
        beschaeftigungsgrad: 0.4
        me_steuerveranlagung: {2028: 37000}
      lina: &p1_lina
        geburtsdatum: 2027-09-01
        kibg_einrichtungstyp: kita
        kibg_einrichtung_anerkannt: true
        kibg_einrichtung_angemeldet: true
        betreuungsstunden: 80
        betreuungstage_mit_obhut: 8
        kibg_betreuungskosten: 1040
  output: &satz_11_00
    persons:
      mutter:
        kibg_einkommen_zaehlt_lit_a: true
        kibg_einkommen_zaehlt_lit_b: false
      vater:
        kibg_einkommen_zaehlt_lit_a: true
      lina:
        kibg_hoechstbeitrag: 11.00
        kibg_beitrag_pro_stunde: 5.50
        kibg_mindestbeitrag: 440

- name: Basis P7 unverändert (hält die Angaben für die folgenden Fälle fest)
  period: 2028-09
  absolute_error_margin: 0.01
  input:
    household: &p7_haushalt
      erziehungsberechtigte: [vater]
      partner: [partnerin]
      kinder: [jonas]
      gemeinsamer_haushalt: false
      beginn_gemeinsamer_haushalt: 2026-01-01
    persons: &p7_personen
      vater: &p7_vater
        wohnsitz_kanton_sg: true
        beschaeftigungsgrad: 0.8
        me_steuerveranlagung: {2028: 51400}
      partnerin: &p7_partnerin
        wohnsitz_kanton_sg: true
        beschaeftigungsgrad: 1.0
        me_steuerveranlagung: {2028: 45600}
      jonas: &p7_jonas
        geburtsdatum: 2024-09-01
        kibg_einrichtungstyp: kita
        kibg_einrichtung_anerkannt: true
        kibg_einrichtung_angemeldet: true
        betreuungsstunden: 72
        betreuungstage_mit_obhut: 8
        kibg_betreuungskosten: 864
  output: &p7_ergebnis
    persons:
      vater:
        kibg_einkommen_zaehlt_lit_a: false
        kibg_einkommen_zaehlt_lit_b: true
      partnerin:
        kibg_einkommen_zaehlt_lit_b: true
      jonas:
        kibg_anspruch: true
        kibg_beitrag_total: 270

