# Datumsregeln D1 bis D11 aus challenge/szenarien.md, Teil 6.
# Familie P1 (Paar, Lina geboren 2027-09-01, Kita, 80 Stunden an 8 Tagen,
# Kosten 1'040, Einkommen 97'000, Faktor 0.5). Geändert werden nur die Daten.
#
# Art. 9 Abs. 2 KiBG: rückwirkend ab Betreuungsbeginn, wenn das Gesuch innert
# 30 Tagen eintrifft, sonst ab dem Gesuch. Art. 25 Abs. 1 KiBV: Gesuche bis
# 2028-11-01 rückwirkend ab Vollzugsbeginn 2028-08-01 (A7). Art. 6 KiBV:
# Teilnahme der Einrichtung ab dem Ersten des Folgemonats nach der Bestätigung.

- name: D1 Gesuch 30 Tage nach Betreuungsbeginn, rückwirkend (Art. 9 Abs. 2 KiBG, A7)
  period: 2029-03
  absolute_error_margin: 0.01
  input:
    household: &haushalt
      erziehungsberechtigte: [mutter, vater]
      kinder: [lina]
      gemeinsamer_haushalt: true
    persons:
      mutter: &mutter
        wohnsitz_kanton_sg: true
        beschaeftigungsgrad: 1.0
        kibg_gesuchstellend: true
        me_steuerveranlagung: {2028: 60000, 2029: 60000}
      vater: &vater
        wohnsitz_kanton_sg: true
        beschaeftigungsgrad: 0.4
        me_steuerveranlagung: {2028: 37000, 2029: 37000}
      lina: &lina
        geburtsdatum: 2027-09-01
        kibg_einrichtungstyp: kita
        kibg_einrichtung_anerkannt: true
        kibg_einrichtung_angemeldet: true
        betreuungsstunden: 80
        betreuungstage_mit_obhut: 8
        kibg_betreuungskosten: 1040
        betreuungsbeginn: 2029-03-01
        kibg_gesuchsdatum: 2029-03-31
  output:
    persons:
      lina:
        kibg_gesuch_innert_frist: true
        kibg_gesuch_in_uebergangsfrist: false
        kibg_beitragsbeginn: 2029-03-01
        kibg_anspruch: true
        # Lina ist 18 Monate alt: Ansatz über 18 Monaten 7.50 × 0.5 × 80
        kibg_beitrag_total: 300

- name: D2 Gesuch 31 Tage nach Betreuungsbeginn, im März kein Beitrag (Art. 9 Abs. 2 KiBG)
  period: 2029-03
  absolute_error_margin: 0.01
  input:
    household: *haushalt
    persons:
      mutter: *mutter
      vater: *vater
      lina: &lina_d2
        <<: *lina
        betreuungsbeginn: 2029-03-01
        kibg_gesuchsdatum: 2029-04-01
  output:
    persons:
      lina:
        kibg_gesuch_innert_frist: false
        kibg_beitragsbeginn: 2029-04-01
        kibg_beitragsbeginn_erreicht: false
        kibg_anspruch: false
        kibg_beitrag_total: 0
        kibg_restkosten_eltern: 1040

